version: "v0.4"
project:
  name: "Gallai's conjecture with two exceptional even vertices"
  description: >-
    Every connected finite simple graph admits an edge partition into at most
    ceil(|V(G)|/2) simple paths when at most two vertices of its induced
    even-degree graph have degree greater than three. One positive designated
    even vertex can be exposed twice at the ceiling budget. Two designated
    even vertices can be exposed twice simultaneously within floor(|V(G)|/2)+1
    paths, giving simultaneous ceiling exposure at odd order. Exceptional
    and ordinary degrees are unrestricted. Simultaneous even-order ceiling
    exposure and the unrestricted Gallai conjecture are not claimed.
  authors:
    - name: "Idris Ali Shaik"
  responsible_maintainers:
    - name: "Idris Ali Shaik"
  license: "Apache-2.0"
